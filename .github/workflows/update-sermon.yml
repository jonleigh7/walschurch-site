# Keeps assets/data/latest-sermon.json pointed at the newest Sunday livestream.
# Runs every 15 minutes on Sunday mornings (so "Live now" shows during service)
# and every 6 hours the rest of the week. Commits only when the sermon changes.
name: Update latest sermon

on:
  schedule:
    - cron: "*/15 16-22 * * 0"   # Sundays, roughly 9am-3pm Pacific
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/update_sermon.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/data/latest-sermon.json; then
            echo "No change"
            exit 0
          fi
          git config user.name "sermon-bot"
          git config user.email "sermon-bot@users.noreply.github.com"
          git add assets/data/latest-sermon.json
          git commit -m "Update latest sermon"
          git push
